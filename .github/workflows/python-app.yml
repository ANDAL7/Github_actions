name: Treasure Game Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test cases
        run: python -m unittest test_main.py -v