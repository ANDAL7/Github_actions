name: Treasure Game

on:
  push:
  workflow_dispatch:

jobs:
  run-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python
        run: python main.py